name: Build reel

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: Ссылка на фото
        required: true
      hook:
        description: Хук, короткий текст на видео
        required: true
      body:
        description: Текст поста для подписи, одной строкой
        required: false
        default: ''
      tag:
        description: Уникальное имя релиза, например reel-2026-10-17
        required: true
      hook_en:
        description: Хук по-английски, строка под русским хуком (необязательно)
        required: false
        default: ''
      body_en:
        description: Подпись по-английски (необязательно)
        required: false
        default: ''
      dry_run:
        description: Пробная сборка true, ролик только сохраняется как файл, без релиза и без публикации
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_URL: ${{ inputs.image_url }}
      HOOK: ${{ inputs.hook }}
      BODY: ${{ inputs.body }}
      HOOK_EN: ${{ inputs.hook_en }}
      BODY_EN: ${{ inputs.body_en }}
      TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Build reel
        run: bash build_reel.sh "$IMAGE_URL" "$HOOK" reel.mp4

      - name: Write release notes
        run: |
          # Описание релиза: хук и подпись отдельными строками, их читает автоматизация для Instagram, TikTok и YouTube.
          printf 'Хук: %s\nПодпись: %s\nHook EN: %s\nCaption EN: %s\n' "$HOOK" "$BODY" "$HOOK_EN" "$BODY_EN" > notes.txt

      - name: Save test video as a private draft (dry run)
        if: env.DRY_RUN == 'true'
        run: |
          # Черновик релиза виден только владельцам репозитория, на публикацию и "последний релиз" не влияет.
          gh release create "$TAG" reel.mp4 --title "$TAG" --notes-file notes.txt --draft

      - name: Publish video as a release
        if: env.DRY_RUN != 'true'
        run: |
          # --latest: этот релиз всегда считается последним (иначе GitHub выбирает по дате коммита, а она у всех одна)
          gh release create "$TAG" reel.mp4 --title "$TAG" --notes-file notes.txt --latest
          echo "VIDEO_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/reel.mp4" >> "$GITHUB_ENV"

      - name: Notify Make
        if: env.MAKE_WEBHOOK_URL != '' && env.DRY_RUN != 'true'
        run: |
          jq -n --arg video_url "$VIDEO_URL" --arg tag "$TAG" --arg hook "$HOOK" --arg body "$BODY" \
                --arg hook_en "$HOOK_EN" --arg body_en "$BODY_EN" \
            '{video_url:$video_url, tag:$tag, hook:$hook, body:$body, hook_en:$hook_en, body_en:$body_en}' \
          | curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @- "$MAKE_WEBHOOK_URL"
